<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Catapult Kingdom</title>
<style>
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%;background:#16120c;color:#f6ecd4;font-family:"Trebuchet MS","Segoe UI",sans-serif}
body{overflow:auto}
.app{max-width:1200px;margin:0 auto;padding:6px}
.scr{background:linear-gradient(#2a2216,#1c160d);border:3px solid #5a4a2a;border-radius:12px;padding:12px;min-height:300px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.top h2{flex:1;font-size:1.3rem;color:#ffc94a}
.chip{background:#3a2e1a;border:2px solid #6a5a34;border-radius:10px;padding:3px 10px;font-weight:bold;font-size:.85rem}
.chip.g{color:#ffd84a}.chip.s{color:#ffe08a}.chip.c{color:#ff9ad8}
button{font:inherit;color:#fff;cursor:pointer}
.btn{font-weight:bold;background:#b0541c;border:3px solid #ffc94a;border-radius:12px;padding:10px 20px;box-shadow:0 4px 0 rgba(0,0,0,.5)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
.btn.g{background:#3a3226;border-color:#8a7a5a}
.btn.b{background:#2a6ab0;border-color:#8cc0ff}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:6px 12px;font-size:.85rem;border-width:2px}
#menu{text-align:center;padding:26px 12px}
#menu h1{font-size:clamp(2rem,7vw,3.6rem);color:#ffc94a;text-shadow:0 4px 0 #6a2a0a;letter-spacing:1px}
#menu p{opacity:.85;margin:6px 0 18px}
.mb{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto}
.world{margin-bottom:12px}
.world h3{font-size:.95rem;margin-bottom:6px;color:#ffc94a}
.sg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.st{background:#3a3226;border:2px solid #6a5a34;border-radius:10px;padding:6px 2px;font-size:.85rem;text-align:center;line-height:1.25}
.st.lock{opacity:.4;cursor:default}
.st small{display:block;color:#ffe08a;font-size:.72rem}
.ld{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.ld button{background:#3a3226;border:2px solid #6a5a34;border-radius:10px;padding:6px 10px;font-size:.8rem}
.ld button.sel{background:#2e7d32;border-color:#8fe08f}
#tw{position:relative;overflow:auto;border:2px solid #4a3c22;border-radius:10px;background:#15110a;height:62vh;min-height:300px}
#tin{position:relative}
#tin svg{position:absolute;left:0;top:0;pointer-events:none}
.nd{position:absolute;width:118px;height:78px;background:#2e2616;border:2px solid #6a5a34;border-radius:10px;padding:4px;text-align:center;line-height:1.15;overflow:hidden}
.nd b{display:block;font-size:.7rem}.nd small{display:block;font-size:.6rem;opacity:.75}
.nd .c{font-size:.68rem;font-weight:bold;color:#ffd84a}
.nd.ok{border-color:#8fe08f;background:#2a3a1c}
.nd.max{border-color:#ffc94a;background:#4a3a14}
.nd.lock{opacity:.45;cursor:default}
.nd.no{border-color:#a05a3a}
#play{padding:6px}
.cw{position:relative}
canvas{width:100%;display:block;border-radius:10px;touch-action:none;user-select:none;-webkit-user-select:none;background:#8fd0f8}
#bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#bar button{position:relative;min-width:64px;flex:1;background:#3a3226;border:2px solid #6a5a34;border-radius:10px;padding:7px 4px;font-size:.78rem;font-weight:bold;overflow:hidden}
#bar button.sel{border-color:#8fe08f;background:#2e5a2a}
#bar button.on{border-color:#ffc94a;background:#6a4a14}
#bar button i{position:absolute;left:0;bottom:0;height:100%;background:rgba(0,0,0,.55);width:0;pointer-events:none}
#bar button span{position:relative}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px;border:1px solid #000}
#res{position:absolute;inset:0;background:rgba(14,10,6,.86);border-radius:10px;display:flex;overflow:auto;padding:10px}
.card{margin:auto;text-align:center;max-width:420px}
.card h2{font-size:2.1rem;color:#ffc94a;margin-bottom:6px}
.card p{margin-bottom:6px}
.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
textarea{width:100%;height:110px;background:#15110a;color:#f6ecd4;border:2px solid #6a5a34;border-radius:8px;padding:8px;font-family:monospace;font-size:.72rem;word-break:break-all}
.msg{min-height:1.4em;margin:6px 0;font-size:.85rem;color:#ffe08a}
.pw{margin-bottom:12px}.pw h3{color:#ffc94a;font-size:.95rem;margin-bottom:4px}
#err{position:fixed;left:6px;right:6px;bottom:6px;background:#7a0c12;color:#fff;padding:8px 10px;border-radius:8px;font-size:.8rem;z-index:99}
</style>
</head>
<body>
<div class="app">
 <section id="menu" class="scr">
  <h1>Catapult Kingdom</h1><p>Defend your castle. Smash armies. Grow your war machine.</p>
  <div class="top" style="justify-content:center"><span class="chip g" id="mCoins"></span><span class="chip s" id="mStars"></span><span class="chip c" id="mCrowns"></span></div>
  <div class="mb">
   <button class="btn" id="bCamp">Campaign</button>
   <button class="btn b" id="bEnd">Endless siege</button>
   <button class="btn g" id="bTree">Skill tree</button>
   <button class="btn g" id="bSave">Save &amp; load</button>
   <button class="btn g" id="bAsc" hidden></button>
  </div>
 </section>
 <section id="stages" class="scr" hidden>
  <div class="top"><h2>Choose a battle</h2><span class="chip g" id="sCoins"></span><span class="chip s" id="sStars"></span><button class="btn g sm" data-go="menu">Back</button></div>
  <div class="ld" id="ld"></div><div id="wl"></div>
 </section>
 <section id="tree" class="scr" hidden>
  <div class="top"><h2>Skill tree</h2><span class="chip g" id="tCoins"></span><span class="chip s" id="tStars"></span><button class="btn g sm" data-go="menu">Back</button></div>
  <div id="tw"><div id="tin"></div></div>
 </section>
 <section id="save" class="scr" hidden>
  <div class="top"><h2>Save &amp; load</h2><button class="btn g sm" data-go="menu">Back</button></div>
  <div class="pw"><h3>Auto-save</h3><div id="sv"></div></div>
  <div class="pw"><h3>Export code</h3><p style="font-size:.8rem;opacity:.8;margin-bottom:6px">Copy this code somewhere safe. Paste it back under Import to restore your progress on any device.</p>
   <textarea id="ex" readonly></textarea>
   <div class="top" style="margin-top:6px"><button class="btn sm" id="bCopy">Copy code</button><button class="btn g sm" id="bSel">Select all</button></div></div>
  <div class="pw"><h3>Import code</h3><textarea id="im" placeholder="Paste your save code here"></textarea>
   <div class="top" style="margin-top:6px"><button class="btn b sm" id="bImp">Load code</button></div></div>
  <div class="msg" id="msg"></div>
  <div class="pw"><h3>Danger zone</h3><button class="btn g sm" id="bReset">Reset all progress</button></div>
 </section>
 <section id="play" class="scr" hidden>
  <div class="cw"><canvas id="cv" width="1200" height="560" aria-label="Battlefield"></canvas><div id="res" hidden></div></div>
  <div id="bar"></div>
 </section>
</div>
<div id="err" hidden></div>

var KEY="catapultKingdomSave",S,storeOk=true;
function blank(){return{v:1,coins:0,run:0,tree:{l0:1,s0:1,c0:1},stars:{},crowns:0,asc:0,best:0,sel:"l0",kills:0,wins:0}}
function fix(o){var b=blank();for(var k in b)if(o[k]===undefined)o[k]=b[k];o.tree.l0=1;o.tree.s0=1;o.tree.c0=1;return o}
function load(){try{var r=localStorage.getItem(KEY);S=r?fix(JSON.parse(r)):blank()}catch(e){storeOk=false;S=blank()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storeOk=true}catch(e){storeOk=false}}
function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return(h>>>0).toString(36)}
function exportCode(){var j=JSON.stringify(S);return"CK1."+hash(j)+"."+btoa(unescape(encodeURIComponent(j)))}
function importCode(code){var p=code.trim().split(".");if(p.length<3||p[0]!=="CK1")throw 0;var j=decodeURIComponent(escape(atob(p.slice(2).join("."))));if(hash(j)!==p[1])throw 0;var o=JSON.parse(j);if(!o||!o.tree)throw 0;S=fix(o);save()}
function lv(id){return S.tree[id]||0}
function stars(){var n=0;for(var k in S.stars)n+=S.stars[k];return n}
function coinMul(){return(1+.08*lv("gold"))*(1+.1*S.crowns)}
function dmgMul(){return(1+.1*lv("dmg"))*(1+.1*S.crowns)}

  else if(f.bolt){c.globalAlpha=clamp(f.l*5,0,1);c.strokeStyle=f.bolt===2?"#e8d8b0":f.bolt===3?"#d0c090":"#ffe94a";c.lineWidth=f.bolt===1?3:2;c.beginPath();var n=f.bolt===1?7:2;c.moveTo(f.x1,f.y1);for(var i=1;i<n;i++)c.lineTo(f.x1+(f.x2-f.x1)*i/n+rnd(-8,8)*(f.bolt===1?1:0),f.y1+(f.y2-f.y1)*i/n+rnd(-8,8)*(f.bolt===1?1:0));c.lineTo(f.x2,f.y2);c.stroke();c.globalAlpha=1}
  else{c.globalAlpha=clamp(f.l*2,0,1);c.fillStyle=f.c;c.beginPath();c.arc(f.x,f.y,f.r,0,7);c.fill();c.globalAlpha=1}});
 if(AIM.on&&ready()){var v=aimVec(),L=curL(),sp=180+(BASEV*(1+.06*lv("pow"))*L.pw-180)*v.pw,ang=v.ang;
  if(v.len>14){var x=MX+Math.cos(ang)*34,y=MY-12-Math.sin(ang)*34,vx=Math.cos(ang)*sp,vy=-Math.sin(ang)*sp,t=0,lim=.5+.2*lv("aim");c.fillStyle="rgba(255,255,255,.85)";
   for(var i=0;i<80&&t<lim;i++){vy+=GRAV*.03;x+=vx*.03;y+=vy*.03;t+=.03;if(y>=GY)break;if(i%2===0){c.beginPath();c.arc(x,y,3,0,7);c.fill()}}}}
 c.restore();
 hud();
}
function hud(){
 var cr=G.hp/G.mh;c.fillStyle="rgba(0,0,0,.55)";c.fillRect(12,12,230,20);c.fillStyle=cr>.5?"#5ecb4a":cr>.25?"#f0c030":"#e03a2a";c.fillRect(12,12,230*Math.max(0,cr),20);
 if(G.shm>0){c.fillStyle="#7ac8ff";c.fillRect(12,34,230*G.sh/G.shm,5)}
 c.font="bold 13px sans-serif";c.textAlign="left";c.fillStyle="#fff";c.fillText("Castle "+Math.ceil(Math.max(0,G.hp))+"/"+G.mh,18,27);
 c.textAlign="center";c.font="bold 18px sans-serif";c.fillStyle="#fff";c.strokeStyle="rgba(0,0,0,.6)";c.lineWidth=4;
 var t=G.mode==="endless"?"Endless - wave "+G.wave:G.type==="defend"?"Wave "+Math.max(1,G.wave)+" / "+G.waves:(G.type==="boss"?"Boss siege":"Siege");c.strokeText(t,CW/2,28);c.fillText(t,CW/2,28);
 c.textAlign="right";c.fillStyle="#ffd84a";c.strokeText("Coins "+fmt(G.coins),CW-14,28);c.fillText("Coins "+fmt(G.coins),CW-14,28);
 c.textAlign="left";c.font="12px sans-serif";c.fillStyle="#fff";if(G.rage>0)c.fillText("RAGE "+G.rage.toFixed(1)+"s",12,56);
 if(!ready()){c.fillStyle="rgba(0,0,0,.5)";c.fillRect(MX-30,MY+34,60,5);c.fillStyle="#ffc94a";var L=curL(),m=Math.max(.25,L.rl*Math.pow(.96,lv("rel"))*(G.rage>0?.5:1));c.fillRect(MX-30,MY+34,60*(1-clamp(G.cd/m,0,1)),5)}
 G.TX.forEach(function(x){c.globalAlpha=clamp(x.t*2,0,1);c.textAlign="center";c.font=(x.big?"bold 34px":"bold 13px")+" sans-serif";c.lineWidth=3;c.strokeStyle="rgba(0,0,0,.6)";c.strokeText(x.s,x.x,x.y);c.fillStyle=x.c;c.fillText(x.s,x.x,x.y);c.globalAlpha=1});
 if(!AIM.on&&!G.last&&G.t<8){c.textAlign="center";c.font="bold 16px sans-serif";c.fillStyle="#fff";c.strokeStyle="rgba(0,0,0,.6)";c.lineWidth=4;c.strokeText("Drag back anywhere, then release to fire!",CW/2,CH-24);c.fillText("Drag back anywhere, then release to fire!",CW/2,CH-24)}
}
/* ---------- input & loop ---------- */
function cp(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*CW/r.width,y:(e.clientY-r.top)*CH/r.height}}
cv.addEventListener("pointerdown",function(e){if(!G||G.done||G.paused)return;e.preventDefault();var p=cp(e);AIM.on=true;AIM.sx=AIM.cx=p.x;AIM.sy=AIM.cy=p.y;try{cv.setPointerCapture(e.pointerId)}catch(x){}});
cv.addEventListener("pointermove",function(e){if(!AIM.on)return;var p=cp(e);AIM.cx=p.x;AIM.cy=p.y});
function release(){if(!AIM.on)return;AIM.on=false;if(!G||G.done||G.paused)return;var v=aimVec();if(v.len>=16&&ready())fire(v.ang,Math.max(.12,v.pw))}
cv.addEventListener("pointerup",release);cv.addEventListener("pointercancel",function(){AIM.on=false});
document.addEventListener("keydown",function(e){if(state!=="play"||!G||G.done)return;var k=e.key;
 if(k==="p"||k==="P"||k==="Escape")pauseToggle();
 else if(k>="1"&&k<="9"){var u=BALL.filter(function(b){return lv(b.id)>0})[+k-1];if(u)G.cur=u.id}
 else if(k==="a"||k==="A"){if(lv("auto"))G.auto=!G.auto}});
function loop(t){
 if(!G||G.done&&state!=="play")return;
 var dt=Math.min(.033,(t-lt)/1000);lt=t;
 if(!G.paused&&!G.done)update(dt);
 draw();updBar();
 if(state==="play")raf=requestAnimationFrame(loop);
}
setInterval(save,15000);
load();show("menu");
})();
</script>
